[pytest]
# Collect only the real suite.
#
# eval/intr/stacker_test.py matches pytest's default `*_test.py` glob, has no
# __main__ guard, os.chdir()s to the repo root and runs a full encompassing
# analysis at import time.  Without this, a bare `pytest` from the repo root
# executes that analysis instead of running the tests.
testpaths = tests
norecursedirs = eval model data scripts tunes outputs paper temp tmp .git .idea __pycache__
